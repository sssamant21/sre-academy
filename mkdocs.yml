site_name: SRE Academy
site_description: Production-grade Kubernetes SRE Engineering Handbook.
site_url: https://sssamant21.github.io/sre-academy/
repo_url: https://github.com/sssamant21/sre-academy
repo_name: sssamant21/sre-academy

theme:
  name: material
  language: en
  features:
    - navigation.instant
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: deep orange
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: deep orange
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

nav:
  - Home: index.md
  - Kubernetes SRE Engineering Handbook:
      - Overview: books/kubernetes/index.md
      - Chapters 1-6:
          - "1. Platform Foundations":
              - Overview: books/kubernetes/chapters/chapter-01-platform-foundations.md
              - "Production Reference": books/kubernetes/chapter-01/production-reference.md
              - "1.1 What Kubernetes Is and Is Not": books/kubernetes/chapter-01/1.1-what-kubernetes-is-and-is-not.md
              - "1.2 Desired State, API Objects, and Reconciliation": books/kubernetes/chapter-01/1.2-desired-state-api-objects-and-reconciliation.md
              - "1.3 Kubernetes Architecture at Production Scale": books/kubernetes/chapter-01/1.3-kubernetes-architecture-at-production-scale.md
              - "1.4 Control Plane and Node Responsibility Boundaries": books/kubernetes/chapter-01/1.4-control-plane-and-node-responsibility-boundaries.md
              - "1.5 Kubernetes Networking Foundations": books/kubernetes/chapter-01/1.5-kubernetes-networking-foundations.md
              - "1.6 Kubernetes Storage Foundations": books/kubernetes/chapter-01/1.6-kubernetes-storage-foundations.md
              - "1.7 Kubernetes Security Foundations": books/kubernetes/chapter-01/1.7-kubernetes-security-foundations.md
              - "1.8 Kubernetes Reliability Model": books/kubernetes/chapter-01/1.8-kubernetes-reliability-model.md
              - "1.9 Production Use Cases and Anti-Patterns": books/kubernetes/chapter-01/1.9-production-use-cases-and-anti-patterns.md
              - "1.10 Chapter 1 Labs and Review Questions": books/kubernetes/chapter-01/1.10-chapter-1-labs-and-review-questions.md
              - "Chapter 1 Glossary": books/kubernetes/chapter-01/glossary.md
          - "2. Cluster Architecture":
              - Overview: books/kubernetes/chapters/chapter-02-cluster-architecture.md
              - "2.1 Cluster Architecture Overview": books/kubernetes/chapter-02/2.1-cluster-architecture-overview.md
              - "2.2 Control Plane Architecture": books/kubernetes/chapter-02/2.2-control-plane-architecture.md
              - "2.3 Worker Node Architecture": books/kubernetes/chapter-02/2.3-worker-node-architecture.md
              - "2.4 API Server, etcd, Scheduler, and Controllers": books/kubernetes/chapter-02/2.4-api-server-etcd-scheduler-and-controllers.md
              - "2.5 Node Lifecycle and Node Conditions": books/kubernetes/chapter-02/2.5-node-lifecycle-and-node-conditions.md
              - "2.6 Cluster Networking Architecture": books/kubernetes/chapter-02/2.6-cluster-networking-architecture.md
              - "2.7 Cluster Storage Architecture": books/kubernetes/chapter-02/2.7-cluster-storage-architecture.md
              - "2.8 Cluster Security Architecture": books/kubernetes/chapter-02/2.8-cluster-security-architecture.md
              - "2.9 Cluster Upgrade and Version Skew Architecture": books/kubernetes/chapter-02/2.9-cluster-upgrade-and-version-skew-architecture.md
              - "2.10 Chapter 2 Labs and Review Questions": books/kubernetes/chapter-02/2.10-chapter-2-labs-and-review-questions.md
              - "Chapter 2 Glossary": books/kubernetes/chapter-02/glossary.md
          - "3. Workloads and Scheduling":
              - Overview: books/kubernetes/chapters/chapter-03-workloads-scheduling.md
              - "3.1 Workload Architecture Overview": books/kubernetes/chapter-03/3.1-workload-architecture-overview.md
              - "3.2 Pods, Containers, and Init Containers": books/kubernetes/chapter-03/3.2-pods-containers-and-init-containers.md
          - "4. Networking and Ingress": books/kubernetes/chapters/chapter-04-networking-ingress.md
          - "5. Storage and Backup": books/kubernetes/chapters/chapter-05-storage-state-backup.md
          - "6. Observability and Operations": books/kubernetes/chapters/chapter-06-observability-operations.md
      - Chapter 7 - kube-apiserver:
          - Overview: books/kubernetes/chapters/chapter-07-kube-apiserver.md
          - "7.1 Introduction": chapter-07/7.1-introduction.md
          - "7.1 Kubernetes API Server Overview": chapter-07/7.1-kubernetes-api-server-overview.md
          - "7.2 Why Kubernetes Uses an API": chapter-07/7.2-why-kubernetes-uses-an-api.md
          - "7.3 End-to-End API Request Lifecycle": chapter-07/7.3-api-request-lifecycle.md
          - "7.3 API Server Architecture": chapter-07/7.3-api-server-architecture.md
          - "7.4 API Request Lifecycle": chapter-07/7.4-api-request-lifecycle.md
          - "7.5 Authentication": chapter-07/7.5-authentication.md
          - "7.6 Authorization": chapter-07/7.6-authorization.md
          - "7.7 Admission Control": chapter-07/7.7-admission-control.md
          - "7.8 API Versioning": chapter-07/7.8-api-versioning.md
          - "7.9 Custom Resource Definitions": chapter-07/7.9-custom-resource-definitions.md
          - "7.10 API Server High Availability": chapter-07/7.10-api-server-high-availability.md
      - Chapters 8-10:
          - "8. etcd": books/kubernetes/chapters/chapter-08-etcd.md
          - "9. kube-scheduler": books/kubernetes/chapters/chapter-09-kube-scheduler.md
          - "10. kubelet": books/kubernetes/chapters/chapter-10-kubelet.md
      - Platform Tooling:
          - Helm: books/kubernetes/helm.md
          - Kustomize: books/kubernetes/kustomize.md
          - GitOps: books/kubernetes/gitops.md
      - Managed Kubernetes:
          - Overview: books/kubernetes/managed-kubernetes/index.md
          - Amazon EKS: books/kubernetes/managed-kubernetes/amazon-eks.md
          - Azure AKS: books/kubernetes/managed-kubernetes/azure-aks.md
          - Google GKE: books/kubernetes/managed-kubernetes/google-gke.md
      - Appendices:
          - "Chapter 1 Review Answers": books/kubernetes/appendices/chapter-01-review-answers.md
          - "Chapter 2 Review Answers": books/kubernetes/appendices/chapter-02-review-answers.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path:
        - .
      check_paths: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true

plugins:
  - search
