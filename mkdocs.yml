site_name: SRE Academy
site_description: Production-grade Kubernetes SRE Engineering Handbook.
site_url: https://sssamant21.github.io/sre-academy/
repo_url: https://github.com/sssamant21/sre-academy
repo_name: sssamant21/sre-academy

theme:
  name: material
  language: en
  features:
    - navigation.instant
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: deep orange
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: deep orange
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

